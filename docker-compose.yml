# Realty Project Community — Docker Compose stack.
#
# 1 customer = 1 Docker stack = 1 Postgres DB = 1 optional Cloudflare
# Tunnel hostname. Isolation per stack:
#   - Compose project name (`realtypro` → network `realtypro_default`)
#   - Container names (`realtypro-*`)
#   - Bind-mount paths
#
# Public access via Cloudflare Tunnel (profile `tunnel`) OR your own
# nginx reverse proxy (see nginx/ folder). NO host ports exposed by
# default — laptop dev override (`compose.override.yml`, gitignored)
# adds port exposure and `--dev=reload` for hot-reload.

name: realtypro

services:
  db:
    image: postgres:16
    container_name: realtypro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before first up}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:19
    container_name: realtypro-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before first up}
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons/_common:/mnt/extra-addons/_common:ro
      - ./addons/_project:/mnt/extra-addons/_project:ro
      - ./data:/var/lib/odoo
    command: odoo

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: realtypro-cloudflared
    restart: unless-stopped
    # Profile-gated: only starts with `docker compose --profile tunnel up -d`.
    # Prevents accidental tunnel boot on laptop dev where you serve via
    # localhost:8169 (port mapped in compose.override.yml).
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      # `:-` instead of `:?` — compose v2 interpolates env vars at parse
      # time, even for services NOT in the active profile. A strict `:?`
      # check would fail laptop-dev runs just because the file mentions
      # cloudflared. The token is still required at runtime — when the
      # `tunnel` profile is enabled and TUNNEL_TOKEN is empty,
      # cloudflared exits with a clear "missing token" error.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - odoo
