[options]
; -- Master password (DB management UI) ------------------------------
; The default below is INSECURE. After first boot:
;   1. Edit this file, change `admin_passwd` to a strong secret.
;   2. `docker compose restart odoo`.
; With `list_db = False` this password is rarely needed in practice,
; but should still be hardened.
admin_passwd = admin

; -- Database connection ---------------------------------------------
; Odoo's docker entrypoint reads any *_host/port/user/password keys
; present here and prefers them over the HOST/USER/PASSWORD env vars
; (see odoo/docker entrypoint.sh `check_config`). To keep the secret
; OUT of the committed file, we intentionally omit `db_password`:
;   - The container env `PASSWORD` (from POSTGRES_PASSWORD in .env)
;     is used by the entrypoint when no `db_password =` line exists
;     in this conf.
;   - host/port/user are stable across deployments, so we pin them
;     here for clarity.
db_host = db
db_port = 5432
db_user = odoo

; -- Single-DB stack -------------------------------------------------
; This Odoo instance serves exactly one database, `dev`. The key is
; `dbfilter` (one word, no underscore) — that is the `dest` name in
; Odoo's argparse registration. Odoo 18 silently accepted `db_filter`
; because the old config loader didn't validate keys; Odoo 19 added
; strict validation and emits "unknown option 'db_filter' ... stored
; as-is, without parsing" if the underscored form is used — the value
; is then silently ignored, leaving the instance unfiltered. Always
; use `dbfilter`.
;
; list_db = False removes the database picker entirely.
;
; If you rename the DB (e.g. to `realtypro`), update dbfilter here
; and any cron / systemd commands that reference the DB name.
dbfilter = ^dev$
list_db = False

; -- Behind reverse proxy (Cloudflare Tunnel / nginx) ----------------
; Trust X-Forwarded-* headers so Odoo records the client IP and uses
; https URLs in mail templates etc.
proxy_mode = True

; -- HTTP interface --------------------------------------------------
; Bind to all interfaces inside the container; reverse proxy
; (same compose network) reaches us via the service name. Setting this
; explicitly silences the Odoo 19 deprecation warning that the
; implicit default will change to 127.0.0.1 in Odoo 20.
http_interface = 0.0.0.0

; -- Performance / workers -------------------------------------------
; workers = 0 keeps everything in one process (longpolling included).
; Suitable for small stacks (<10 concurrent users). For higher load,
; bump to 2-4 and tune memory limits.
workers = 0
limit_memory_hard = 2147483648
limit_memory_soft = 1610612736
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = 1800

; -- Addons path -----------------------------------------------------
; Order matters: _common loaded first (re_base, re_party, re_loan,
; re_pricing_base, etc.) so _project addons can depend on them.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons/_common,/mnt/extra-addons/_project

; -- Filestore + logs ------------------------------------------------
data_dir = /var/lib/odoo
log_level = info
without_demo = True
