user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    client_max_body_size 200M;            # PDF reports + image uploads
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    # gzip is usually a win for Odoo's JSON-RPC and assets.
    gzip on;
    gzip_disable "msie6";
    gzip_proxied any;
    gzip_min_length 1100;
    gzip_types text/plain text/xml text/css text/javascript
               application/javascript application/json
               application/xml application/x-font-ttf
               image/svg+xml;

    # Upstreams to the Odoo container.
    upstream odoo {
        server odoo:8069;
    }
    upstream odoo_chat {
        server odoo:8072;       # longpolling / websocket
    }

    # Per-domain server blocks live in /etc/nginx/sites-available/.
    # See sites-available/realtypro.conf.example for a working template
    # you can customize.
    include /etc/nginx/sites-available/*.conf;
}
